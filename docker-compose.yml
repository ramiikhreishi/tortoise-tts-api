version: '3.8'

services:
  tortoise-api:
    build: .
    image: tortoise-tts-api
    container_name: tortoise-api
    ports:
      - "8000:8000"
    environment:
      - TORTOISE_MODELS_DIR=/models
    volumes:
      - /mnt/user/data/tortoise_tts/models:/models
      - /mnt/user/data/tortoise_tts/results:/results
      - /mnt/user/data/.cache/huggingface:/root/.cache/huggingface
      - /mnt/user/data/tortoise_tts/logs:/app/logs
      - /root:/work
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/cuda').read()"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    labels:
      - autoheal=true
  autoheal:
    image: willfarrell/autoheal
    container_name: autoheal
    restart: unless-stopped
    environment:
      - AUTOHEAL_INTERVAL=30
      - AUTOHEAL_START_PERIOD=120
      # Optional: only restart if unhealthy for >= 2 minutes
      # - AUTOHEAL_CONTAINER_LABEL=all
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro