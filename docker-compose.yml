version: '3.8'

services:
  tortoise-api:
    build: .
    image: tortoise-tts-api
    container_name: tortoise-api
    ports:
      - "8000:8000"
    environment:
      - TORTOISE_MODELS_DIR=/models
    volumes:
      - tortoise-models:/models
      - tortoise-results:/results
      - tortoise-hf-cache:/root/.cache/huggingface
      - tortoise-logs:/app/logs
      # use_deepspeed=True on Linux JIT-compiles CUDA kernels via nvcc/ninja on
      # first use (10-20+ min). Persist the compiled extensions so this only
      # ever happens once instead of on every container restart.
      - tortoise-torch-extensions:/root/.cache/torch_extensions
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/cuda').read()"]
      interval: 30s
      timeout: 10s
      retries: 3
      # Generous to survive the one-time DeepSpeed JIT compile on first boot —
      # autoheal would otherwise kill and restart the container mid-compile.
      start_period: 1200s
    labels:
      - autoheal=true
  autoheal:
    image: willfarrell/autoheal
    container_name: autoheal
    restart: unless-stopped
    environment:
      - AUTOHEAL_INTERVAL=30
      - AUTOHEAL_START_PERIOD=120
      # Optional: only restart if unhealthy for >= 2 minutes
      # - AUTOHEAL_CONTAINER_LABEL=all
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro

volumes:
  tortoise-models:
  tortoise-results:
  tortoise-hf-cache:
  tortoise-logs:
  tortoise-torch-extensions: